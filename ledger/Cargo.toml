[package]
name = "leca-ledger"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
commonware-runtime = "2026.9.0"
nunchi-coins = { git = "https://github.com/nunchi-labs/sdk", default-features = false, features = ["ledger"] }
nunchi-common = { git = "https://github.com/nunchi-labs/sdk", default-features = false, features = ["state"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
