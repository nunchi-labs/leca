name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  AUTH_API: https://gno.money

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: server
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - name: Server tests
        working-directory: server
        run: |
          dart analyze
          dart test

  package:
    needs: test
    uses: ./.github/workflows/build.yml

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          base="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          echo "tag=v${base}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Leca ${{ steps.version.outputs.base }} build ${{ github.run_number }}
          generate_release_notes: true
          body: |
            Builds from `${{ github.sha }}` with `AUTH_API=${{ env.AUTH_API }}`.

            - `Leca-android.apk`: debug-keystore signed, installs on any Android device
            - `Leca-ios-unsigned.ipa`: no code signature; sign with your own certificate before installing
            - `Leca-macos.zip`: unsigned app bundle; right-click Open on first launch
            - `Leca-windows-x64.zip` and `Leca-windows-arm64.zip`: unzip and run `leca.exe`
            - `Leca-linux-x64.zip` and `Leca-linux-arm64.zip`: unzip and run `leca`
            - `Leca-web.zip`: the browser app, served under `/app/`
          files: dist/*
