name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter compact

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Linters
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck yamllint cppcheck libxml2-utils jq tidy \
            ruby python3-pip python3-venv
          python3 -m venv /tmp/lint-venv
          /tmp/lint-venv/bin/pip install cmakelint
          echo /tmp/lint-venv/bin >> "$GITHUB_PATH"
          sudo gem install rubocop --no-document
          sudo curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/actionlint.tar.gz actionlint
          sudo curl -fsSL -o /usr/local/bin/ktlint \
            https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          sudo chmod +x /usr/local/bin/ktlint
          curl -fsSL -o /tmp/pwsh.tar.gz \
            https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          pwsh -NoProfile -Command \
            "Set-PSRepository PSGallery -InstallationPolicy Trusted"
          pwsh -NoProfile -Command \
            "Install-Module PSScriptAnalyzer -Force -Scope CurrentUser"
          curl -fsSL -o /tmp/caddy.tar.gz \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/caddy.tar.gz caddy
      - run: bash scripts/lint.sh

  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: SwiftLint
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          bin="$(find /tmp/swiftlint -type f -name swiftlint | head -1)"
          "$bin" lint --strict --quiet

  # Pull requests stay on the jobs above. A push to main also builds
  # every app, in parallel, through the same ./build.sh used on the machines.
  package:
    needs: [server, app, lint, swift]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
