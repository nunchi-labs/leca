name: Package

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  LECA_AUTH_API: https://gno.money
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
            kind: android
          - target: linux-x64
            runner: ubuntu-latest
            kind: linux
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            kind: linux
          - target: web
            runner: ubuntu-latest
            kind: web
          - target: macos
            runner: macos-latest
            kind: apple
          - target: ios
            runner: macos-latest
            kind: apple
          - target: windows-x64
            runner: windows-latest
            kind: windows
          - target: windows-arm64
            runner: windows-11-arm
            kind: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Linux libraries
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip unzip
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'ios'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'ios'
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        if: matrix.target != 'linux-arm64' && matrix.target != 'windows-arm64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The setup action has no arm64 archive for this Flutter version.
      # The framework still downloads the arm64 engine for the host.
      - name: Flutter on ARM
        if: matrix.target == 'linux-arm64' || matrix.target == 'windows-arm64'
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          bin="$RUNNER_TEMP/flutter/bin"
          if command -v cygpath >/dev/null; then
            bin="$(cygpath -w "$bin")"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          if [[ ${{ matrix.target }} == linux-arm64 ]]; then
            "$RUNNER_TEMP/flutter/bin/flutter" precache --linux
          else
            "$RUNNER_TEMP/flutter/bin/flutter" precache --windows
          fi
      - run: ./build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Leca-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
