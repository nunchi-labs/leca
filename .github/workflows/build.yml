name: Package

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  LECA_AUTH_API: https://gno.money
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
            kind: android
          - target: linux-x64
            runner: ubuntu-latest
            kind: linux
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            kind: linux
          - target: web
            runner: ubuntu-latest
            kind: web
          - target: macos
            runner: macos-latest
            kind: apple
          - target: ios
            runner: macos-latest
            kind: apple
          - target: windows-x64
            runner: windows-latest
            kind: windows
          - target: windows-arm64
            runner: windows-11-arm
            kind: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Linux libraries
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip unzip
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'ios'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'ios'
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: ./build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Leca-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
