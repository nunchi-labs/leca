strict: true
excluded:
  - macos/Flutter
  - ios/Flutter
line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
